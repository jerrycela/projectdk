<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project DK — Prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 測試工具列（僅測試模式顯示） -->
  <div id="test-toolbar" class="test-toolbar" style="display: none;">
    <div class="test-toolbar-left">
      <span class="test-label">🧪 測試模式</span>
      <span id="testLevelName" class="test-level-name">載入中...</span>
    </div>
    <div class="test-toolbar-center">
      <span id="testStats" class="test-stats">
        波次: 0/0 | 敵人: 0 | 金幣: 0 | 地心: 100
      </span>
    </div>
    <div class="test-toolbar-right">
      <button id="btnTestRestart" class="test-btn" title="重新開始測試">🔄 重新開始</button>
      <button id="btnTestEditor" class="test-btn" title="返回編輯器">✏️ 編輯器</button>
      <button id="btnTestClose" class="test-btn test-btn-close" title="關閉測試">✕ 關閉</button>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>
  </div>
  <!-- Config 模組化拆分 -->
  <script src="js/config/config-core.js"></script>
  <script src="js/config/config-colors.js"></script>
  <script src="js/config/config-utils.js"></script>
  <script src="js/config/config-data.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/math-cache.js"></script>
  <script src="js/particle-pool.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/pixelart.js"></script>

  <!-- Map 系統模組化檔案 -->
  <script src="js/map/map-core.js"></script>
  <script src="js/map/map-pathfinding.js"></script>
  <script src="js/map/map-tiles-basic.js"></script>
  <script src="js/map/map-tiles-special.js"></script>
  <script src="js/map/map-tiles-portal.js"></script>
  <script src="js/map/map-tiles-heart.js"></script>
  <script src="js/map/map-render.js"></script>
  <script src="js/map/map-decorations.js"></script>

  <script src="js/elements.js"></script>
  <script src="js/traps.js"></script>
  <script src="js/doors.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/heroes.js"></script>
  <script src="js/undo-system.js"></script>

  <!-- 編輯器系統 -->
  <script src="js/editor/editor-main.js"></script>
  <script src="js/editor/editor-tools.js"></script>
  <script src="js/editor/editor-ui.js"></script>
  <script src="js/editor/editor-minimap.js"></script>
  <script src="js/editor/editor-portal.js"></script>
  <script src="js/editor/editor-storage.js"></script>
  <script src="js/editor/editor-wave.js"></script>

  <!-- UI 模組化拆分 -->
  <!-- ui.js 必須先載入（定義 DK.UI 基礎物件）-->
  <script src="js/ui.js"></script>
  <!-- ui 渲染模組擴展 DK.UI -->
  <script src="js/ui/ui-render-buttons.js"></script>
  <script src="js/ui/ui-render-gameplay.js"></script>
  <script src="js/ui/ui-render-screens.js"></script>
  <script src="js/ui/ui-tooltip.js"></script>
  <script src="js/ui/ui-notifications.js"></script>
  <script src="js/game.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/test-toolbar.js"></script>
  <!-- Main 系統模組化（2026-02-14）-->
  <!-- main-effects.js 和 main-render.js 必須在 main.js 之前載入 -->
  <script src="js/main-effects.js"></script>
  <script src="js/main-render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
